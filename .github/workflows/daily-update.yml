name: 每日更新報告

# 排程時間為 UTC。22:23 UTC = 台北隔日 06:23、東京隔日 07:23，
# 這個時間點美股已收盤、亞股前一日資料也齊了，早上起來就能看到最新報告。
#
# ## 為什麼是 `0-5` 而不是 `0-4`
#
# 原本少了週五那一班，而少的正是最該有的那一班：
#
#   美股週五收盤   = 台北**週六** 04:00（冬令 05:00）
#   下一次排程     = 週日 22:30 UTC = 台北**週一** 06:30
#
# 所以整個週末，報告上的美股是**週四的收盤**——而週末正是有空坐下來看盤的時候。
# 加上週五那一班（22:23 UTC = 台北週六 06:23）之後，週六早上就看得到週五收盤。
#
# 週六那一班（台北週日早上）不加：它抓到的還是週五的收盤，和前一天一模一樣，
# 只會多一次沒有內容的發布。
#
# ## 為什麼是 `:23` 而不是 `:30`
#
# GitHub 的排程在**整點與圓整分鐘**最擁塞，而負載夠高的時候排程會被直接丟掉
# ——不通知、不記錄，在 Actions 分頁上和「還沒開始跑」長得一模一樣。把分鐘挪到
# 一個沒有人選的數字，成本是零。
#
# 提前七分鐘也不是隨便挑的：下游 tw-six-metrics 的 pages 排程要等這一班產完才
# 去抓它的頁面，早七分鐘就是多七分鐘緩衝。冬令時美股 21:00 UTC 收盤，22:23
# 仍然留了 83 分鐘。
#
# ## 2026-09-23：週一那一班拿掉，加一班保險
#
# 台北**週一** 06:23 那一班抓到的是週五的美股、週五的台股與日股——和週六早上那
# 一班一模一樣（週末沒有任何市場開盤），所以改成台北週二～週六。
#
# 保險那一班在台北 07:03：GitHub 負載高的時候會延遲甚至直接丟掉排程，而丟掉就
# 是一整天沒有報告。它開頭先看 Pages 上的報告是不是今天產的（「報告生成時間：
# 今天」），是就直接結束——06:23 那班成功的日子，它什麼都不做。整條 workflow 共用
# 一把鎖（concurrency），所以 06:23 那班被延遲到 07:03 之後的話，保險那一班會
# 等它做完再檢查，不會兩班一起跑。下游 tw-six-metrics 的 pages 在 07:37 來拿。
on:
  schedule:
    - cron: "23 22 * * 1-5"   # 週一～週五 22:23 UTC = 台北週二～週六 06:23
    - cron: "3 23 * * 1-5"    # 保險：台北週二～週六 07:03，今天已經有報告就不跑
  workflow_dispatch:           # 也可以在 Actions 頁面手動按按鈕執行

permissions:
  contents: write
  # 發布 Pages 要的兩個。報告不再進 git，改由 deploy-pages 直接送上去。
  pages: write
  id-token: write

concurrency:
  # 與手動管理流程共用同一把鎖，避免兩邊同時推送造成衝突
  group: market-monitor-write
  cancel-in-progress: false

jobs:
  # 只有保險那一班會真的檢查；主班與手動觸發一律照跑。
  gate:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          SCHED: ${{ github.event.schedule }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$SCHED" != "3 23 * * 1-5" ]; then
            exit 0
          fi
          today="$(TZ=Asia/Taipei date +%Y-%m-%d)"
          # 查詢字串是為了繞過 Pages 前面那層 CDN 的快取（最多十分鐘）。
          if curl -fsSL --max-time 60 "https://metallicatw.github.io/market-monitor/?t=$(date +%s)" \
               | grep -q "報告生成時間：$today"; then
            echo "::notice::今天（$today）的報告已經發布了，保險這一班不必跑"
            echo "skip=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::06:23 那一班今天沒有產出報告（被 GitHub 延遲或丟掉），保險這一班補跑"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.skip != 'yes'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
    steps:
      - name: 取得專案
        uses: actions/checkout@v5

      - name: 準備 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # run.py update 的結束碼：0 全部成功／2 有來源失敗但報告仍產出／其他為真失敗。
      # 2 只發警告不讓 job 紅 —— 官方端點偶爾抽風是常態，每次都紅會讓人開始忽略通知；
      # 但也絕不能安靜帶過，所以留一個 Actions 警告註記，連續幾天出現就看得出來。
      - name: 更新資料並產生報告
        id: update
        run: |
          set +e
          python run.py update
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "::warning title=有資料源沒抓到::報告已用既有快取產生，請看上面的 log 確認是哪幾個來源。"
          elif [ "$code" -ne 0 ]; then
            echo "::error title=更新流程失敗::結束碼 $code，本次不會有新報告。"
            exit "$code"
          fi

      # 財報窗口偵測。
      #
      # 這支程式本來只有手動才會跑，於是它的偵測窗口（季末後 25～50 天）
      # 沒有人在看——實測 7 檔個股的季報整整缺一季（停在 FY26Q4、季末
      # 2026-03-31、83 天前），而它回報「一切正常」，因為窗口早就過了。
      #
      # 掛進排程之後，逾期那一類會用 ::warning 浮到 Actions 的摘要上。
      # 它永遠不會讓 job 變紅：資料庫要補什麼是人的決定，不是排程的。
      - name: 檢查有沒有財報該更新
        if: always() && steps.update.outputs.exit_code != ''
        run: python check_earnings_due.py || true

      # 為什麼是這一串條件而不是 `always()`：
      #
      # 需求是「部分失敗時，當天已經抓到的資料與報告仍然要提交」——市值那種靠
      # 逐月累積的歷史檔丟掉就補不回來。`always()` 確實涵蓋了那個情況，但它同時
      # 也涵蓋了**取消與 runner 被砍**：timeout、使用者按取消、OOM，`always()`
      # 一樣會跑，`git add -A` 一樣會把當下磁碟上的東西提交進去。
      #
      # 寫檔現在是原子的（`fetch_market_data._write_json`：暫存檔 → fsync →
      # os.replace），所以就算真的被砍在中途，磁碟上也只會是完整的舊版。但沒有
      # 理由在那種狀態下還去 commit 一份「不知道跑到哪裡」的快照。
      #
      # 這個條件的意思是：正常跑完，或者更新那一步自己回報失敗（含 exit 2 的
      # 那條路）。job 被取消不在裡面。
      - name: 有變動才提交
        if: success() || steps.update.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "資料沒有變動，這次不提交。"
          else
            git commit -m "每日更新：$(date -u '+%Y-%m-%d')"
            git push
          fi

      # upload-pages-artifact 會把整個資料夾送上去，所以先挑出真的要公開的那一個。
      # 直接送 repo 根目錄的話，config.json、data/、還有整包 Python 都會變成
      # 公開網站的一部分。
      - name: 挑出要公開的檔案
        if: hashFiles('index.html') != ''
        run: |
          mkdir -p pages
          cp index.html pages/index.html

      # ── 發布報告到 GitHub Pages ────────────────────────────────────────
      #
      # 報告不再進 git（見 .gitignore 裡那段），所以它到得了網頁的唯一一條路就是
      # 這三步。以前是「commit 上去，Pages 從 main 根目錄讀」，而那個設定逼著一個
      # 每天重新產生的 1 MB 檔案被版控——每一次合併都撞在它身上，撞出來的衝突還
      # 沒有哪一邊是對的（兩邊都是產生出來的）。
      #
      # ⚠️ 前提：Settings → Pages → Source 要是「GitHub Actions」，不是
      #    「Deploy from a branch」。還停在後者的話，deploy 這一步會失敗——而
      #    那個失敗是對的，因為那時候網頁上顯示的是一份不會再更新的舊報告。
      #
      # `if: hashFiles(...)`：報告產不出來的那幾次（來源掛掉）不要去發布，
      # 讓網址上繼續是上一份好的。
      - name: 準備發布
        if: hashFiles('index.html') != ''
        uses: actions/configure-pages@v5
      - name: 打包報告
        if: hashFiles('index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: 發布
        id: deployment
        if: hashFiles('index.html') != ''
        uses: actions/deploy-pages@v4
