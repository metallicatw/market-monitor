name: 每日更新報告

# 排程時間為 UTC。22:23 UTC = 台北隔日 06:23、東京隔日 07:23，
# 這個時間點美股已收盤、亞股前一日資料也齊了，早上起來就能看到最新報告。
#
# ## 為什麼是 `0-5` 而不是 `0-4`
#
# 原本少了週五那一班，而少的正是最該有的那一班：
#
#   美股週五收盤   = 台北**週六** 04:00（冬令 05:00）
#   下一次排程     = 週日 22:30 UTC = 台北**週一** 06:30
#
# 所以整個週末，報告上的美股是**週四的收盤**——而週末正是有空坐下來看盤的時候。
# 加上週五那一班（22:23 UTC = 台北週六 06:23）之後，週六早上就看得到週五收盤。
#
# 週六那一班（台北週日早上）不加：它抓到的還是週五的收盤，和前一天一模一樣，
# 只會多一次沒有內容的發布。
#
# ## 為什麼是 `:23` 而不是 `:30`
#
# GitHub 的排程在**整點與圓整分鐘**最擁塞，而負載夠高的時候排程會被直接丟掉
# ——不通知、不記錄，在 Actions 分頁上和「還沒開始跑」長得一模一樣。把分鐘挪到
# 一個沒有人選的數字，成本是零。
#
# 提前七分鐘也不是隨便挑的：下游 tw-six-metrics 的 pages 排程要等這一班產完才
# 去抓它的頁面，早七分鐘就是多七分鐘緩衝。冬令時美股 21:00 UTC 收盤，22:23
# 仍然留了 83 分鐘。
on:
  schedule:
    - cron: "23 22 * * 0-5"   # 週日～週五 22:23 UTC = 台北週一～週六 06:23
  workflow_dispatch:           # 也可以在 Actions 頁面手動按按鈕執行

permissions:
  contents: write
  # 發布 Pages 要的兩個。報告不再進 git，改由 deploy-pages 直接送上去。
  pages: write
  id-token: write

concurrency:
  # 與手動管理流程共用同一把鎖，避免兩邊同時推送造成衝突
  group: market-monitor-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
    steps:
      - name: 取得專案
        uses: actions/checkout@v5

      - name: 準備 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # run.py update 的結束碼：0 全部成功／2 有來源失敗但報告仍產出／其他為真失敗。
      # 2 只發警告不讓 job 紅 —— 官方端點偶爾抽風是常態，每次都紅會讓人開始忽略通知；
      # 但也絕不能安靜帶過，所以留一個 Actions 警告註記，連續幾天出現就看得出來。
      - name: 更新資料並產生報告
        id: update
        run: |
          set +e
          python run.py update
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "::warning title=有資料源沒抓到::報告已用既有快取產生，請看上面的 log 確認是哪幾個來源。"
          elif [ "$code" -ne 0 ]; then
            echo "::error title=更新流程失敗::結束碼 $code，本次不會有新報告。"
            exit "$code"
          fi

      # 為什麼是這一串條件而不是 `always()`：
      #
      # 需求是「部分失敗時，當天已經抓到的資料與報告仍然要提交」——市值那種靠
      # 逐月累積的歷史檔丟掉就補不回來。`always()` 確實涵蓋了那個情況，但它同時
      # 也涵蓋了**取消與 runner 被砍**：timeout、使用者按取消、OOM，`always()`
      # 一樣會跑，`git add -A` 一樣會把當下磁碟上的東西提交進去。
      #
      # 寫檔現在是原子的（`fetch_market_data._write_json`：暫存檔 → fsync →
      # os.replace），所以就算真的被砍在中途，磁碟上也只會是完整的舊版。但沒有
      # 理由在那種狀態下還去 commit 一份「不知道跑到哪裡」的快照。
      #
      # 這個條件的意思是：正常跑完，或者更新那一步自己回報失敗（含 exit 2 的
      # 那條路）。job 被取消不在裡面。
      - name: 有變動才提交
        if: success() || steps.update.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "資料沒有變動，這次不提交。"
          else
            git commit -m "每日更新：$(date -u '+%Y-%m-%d')"
            git push
          fi

      # upload-pages-artifact 會把整個資料夾送上去，所以先挑出真的要公開的那一個。
      # 直接送 repo 根目錄的話，config.json、data/、還有整包 Python 都會變成
      # 公開網站的一部分。
      - name: 挑出要公開的檔案
        if: hashFiles('index.html') != ''
        run: |
          mkdir -p pages
          cp index.html pages/index.html

      # ── 發布報告到 GitHub Pages ────────────────────────────────────────
      #
      # 報告不再進 git（見 .gitignore 裡那段），所以它到得了網頁的唯一一條路就是
      # 這三步。以前是「commit 上去，Pages 從 main 根目錄讀」，而那個設定逼著一個
      # 每天重新產生的 1 MB 檔案被版控——每一次合併都撞在它身上，撞出來的衝突還
      # 沒有哪一邊是對的（兩邊都是產生出來的）。
      #
      # ⚠️ 前提：Settings → Pages → Source 要是「GitHub Actions」，不是
      #    「Deploy from a branch」。還停在後者的話，deploy 這一步會失敗——而
      #    那個失敗是對的，因為那時候網頁上顯示的是一份不會再更新的舊報告。
      #
      # `if: hashFiles(...)`：報告產不出來的那幾次（來源掛掉）不要去發布，
      # 讓網址上繼續是上一份好的。
      - name: 準備發布
        if: hashFiles('index.html') != ''
        uses: actions/configure-pages@v5
      - name: 打包報告
        if: hashFiles('index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: 發布
        id: deployment
        if: hashFiles('index.html') != ''
        uses: actions/deploy-pages@v4
