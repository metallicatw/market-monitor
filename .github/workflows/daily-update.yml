name: 每日更新報告

# 排程時間為 UTC。22:30 UTC 約等於台北隔日 06:30、東京隔日 07:30，
# 這個時間點美股已收盤、亞股前一日資料也齊了，早上起來就能看到最新報告。
on:
  schedule:
    - cron: "30 22 * * 0-4"   # 週日到週四的 22:30 UTC = 週一到週五早上
  workflow_dispatch:           # 也可以在 Actions 頁面手動按按鈕執行

permissions:
  contents: write

concurrency:
  # 與手動管理流程共用同一把鎖，避免兩邊同時推送造成衝突
  group: market-monitor-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
    steps:
      - name: 取得專案
        uses: actions/checkout@v5

      - name: 準備 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # run.py update 的結束碼：0 全部成功／2 有來源失敗但報告仍產出／其他為真失敗。
      # 2 只發警告不讓 job 紅 —— 官方端點偶爾抽風是常態，每次都紅會讓人開始忽略通知；
      # 但也絕不能安靜帶過，所以留一個 Actions 警告註記，連續幾天出現就看得出來。
      - name: 更新資料並產生報告
        id: update
        run: |
          set +e
          python run.py update
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "::warning title=有資料源沒抓到::報告已用既有快取產生，請看上面的 log 確認是哪幾個來源。"
          elif [ "$code" -ne 0 ]; then
            echo "::error title=更新流程失敗::結束碼 $code，本次不會有新報告。"
            exit "$code"
          fi

      # 一定要 always()：部分失敗時當天已經抓到的資料與報告仍然有價值，
      # 不提交等於把它們丟掉，而市值那種靠逐月累積的歷史檔丟掉就補不回來了。
      - name: 有變動才提交
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "資料沒有變動，這次不提交。"
          else
            git commit -m "每日更新：$(date -u '+%Y-%m-%d')"
            git push
          fi
