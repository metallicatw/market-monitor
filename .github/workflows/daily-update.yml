name: 每日更新報告

# 排程時間為 UTC。22:30 UTC 約等於台北隔日 06:30、東京隔日 07:30，
# 這個時間點美股已收盤、亞股前一日資料也齊了，早上起來就能看到最新報告。
on:
  schedule:
    - cron: "30 22 * * 0-4"   # 週日到週四的 22:30 UTC = 週一到週五早上
  workflow_dispatch:           # 也可以在 Actions 頁面手動按按鈕執行

permissions:
  contents: write

concurrency:
  # 與手動管理流程共用同一把鎖，避免兩邊同時推送造成衝突
  group: market-monitor-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
    steps:
      - name: 取得專案
        uses: actions/checkout@v4

      - name: 準備 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 更新資料並產生報告
        run: python run.py update

      - name: 有變動才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "資料沒有變動，這次不提交。"
          else
            git commit -m "每日更新：$(date -u '+%Y-%m-%d')"
            git push
          fi
