name: 每日自動更新市場報告與發布

on:
  schedule:
    # 台灣時間每週一至週五 07:15 自動執行 (UTC Sun-Thu 23:15)
    - cron: '15 23 * * 0-4'
  workflow_dispatch: # 支援在 GitHub 網頁手動隨時觸發更新

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出儲存庫程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝必要爬蟲與數據處理套件
        run: |
          pip install requests yfinance beautifulsoup4 pandas

      - name: 執行數據擷取與報告生成腳本
        run: |
          python generate_report.py

      - name: 部署最新 index.html 至 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
