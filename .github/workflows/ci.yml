name: CI

# 這個 repo 的兩條排程都直接 commit 到 main：「每日更新報告」寫 data/*.json 與
# index.html，「管理追蹤名單」寫 config.json。中間沒有 PR、沒有審查、沒有測試。
#
# 而 tests/test_parsers_offline.py 裡有十三個測試，每一個都拿
# reference/samples/ 裡真的打過端點拿回來的原始位元組去驗 parser——單位對不對、
# 量級對不對、市值兩個來源加起來跟 t49 對不對得上。那份東西一次都沒有在 CI
# 跑過。parser 改壞的話，第一個知道的是隔天早上的報告，而壞掉的數字已經
# commit 進 data/ 了。
#
# 這條 workflow 就是把那道門補上。它完全不打網路（測試全部走 fixture），
# 所以跑完只要幾秒。

on:
  push:
    branches: [main]
    # 只有資料檔變動的那些 commit（排程每天推的）不需要重跑測試——
    # 程式沒變，測試結果不會變。
    paths-ignore:
      - "data/**"
      - "index.html"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 這個 repo 刻意零第三方依賴（連櫃買那份月報都是走 ODS 用 stdlib 解，
      # 就是為了不引 xlrd）。所以這裡沒有 pip install——如果哪天這一步變成
      # 必要的，那本身就是一個該被討論的決定。
      - name: 離線 parser 測試
        run: python tests/test_parsers_offline.py

      # 卡片上那幾顆按鈕現在**不等雲端**：按下去畫面就改，跑失敗才還原。那段還原
      # 邏輯只有真的把 DOM 動一遍才驗得出來（卡片有沒有回到原來的位置、還原鈕有
      # 沒有跟著收掉），所以這一條把產生器實際送出去的那段 JS 接上一個極小的 DOM，
      # 在 node 裡原封不動跑一次。
      #
      # node 是 ubuntu runner 內建的，這裡沒有 setup-node、也沒有 npm install
      # ——上面那句「刻意零第三方依賴」仍然成立。
      - name: 卡片按鈕的 JS
        run: python tests/test_card_actions_js.py

      # 兩種「成功地產出一份錯的東西」：設定檔被改壞卻安靜退回內建清單（報告上
      # 少六檔，而頁面上沒有一個字說少了東西），以及 TAIEX 一個月都沒抓到卻回了
      # 既有快取（程式說「全部成功更新」，資料停在兩週前）。兩種的結束碼都是 0、
      # job 都是綠的——也就是這條 CI 以外沒有人會發現。
      - name: 設定檔與失敗傳遞
        run: python tests/test_config_and_failures.py

      # 手機上的 💡 說明。量出來的是三十八顆按鈕**全部**小於 36px（最小 15×12）
      # 以及四段說明比一整頁還長——兩者都不會報錯，只是按不準、讀完找不到路回去。
      # 版面要真的瀏覽器才量得到，這裡守的是那些量測背後的 CSS 與 JS 規則。
      - name: 手機版說明的可視範圍
        run: python tests/test_info_tips.py

      # 分頁排版：五個分頁、子分頁、趨勢圖收在摺疊裡、頁面上沒有重複的 id、
      # 分頁的 JS 跟圖表分開放、送出去的每一段 JS 語法都對。用 repo 裡的 data/
      # 產生一份報告來檢查（--local，不寄信、不動正式的 index.html）。
      - name: 分頁排版
        run: python tests/test_tabs_layout.py

      # 報告產生器有 1,900 行 f-string。語法錯誤在排程上是「今天沒有報告」，
      # 在這裡是三秒鐘就看得到的紅字。
      - name: 語法檢查
        run: |
          python -m compileall -q \
            fetch_market_data.py generate_report_local.py config_loader.py \
            explanations.py run.py manage_stock.py

      # 設定檔壞掉的症狀是「報告少了幾格但沒有人知道」，所以順手驗一下它讀得動。
      - name: 設定檔讀得動
        run: |
          python -c "
          import config_loader as c
          fred = c.load_fred_series()
          idx = c.load_us_indices()
          groups = c.load_us_indicator_groups()
          assert fred and idx and groups, '設定檔讀出空的'
          missing = [s['id'] for s in fred if not s.get('years_back')]
          assert not missing, f'這些序列沒有 years_back：{missing}'
          print(f'設定 ok：FRED {len(fred)} 檔、指數 {len(idx)} 檔、分組 {len(groups)} 組')
          "
