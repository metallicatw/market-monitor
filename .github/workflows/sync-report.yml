name: 每日自動抓取 Google Drive 報告並發布

on:
  schedule:
    # 台灣時間每週一至週五 07:15 自動執行 (對應 UTC Sun-Thu 23:15)
    - cron: '15 23 * * 0-4'
  workflow_dispatch: # 支援在 GitHub 網頁上手動一鍵立即更新

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 簽出儲存庫
        uses: actions/checkout@v4

      - name: 安裝 gdown 並下載真實報告 HTML
        run: |
          pip install --upgrade gdown
          # 使用 gdown 確保 100% 完整下載 Google Drive 報告，絕不產生空白檔案
          gdown --id "1zL2F1MkNqPhPtZMsh3ZniFYk1sTpbV1b" -O index.html
          ls -la index.html

      - name: 設定 GitHub Pages 環境
        uses: actions/configure-pages@v5

      - name: 上傳網頁成品
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 官方直接部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
