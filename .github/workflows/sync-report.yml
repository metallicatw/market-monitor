name: 每日自動抓取 Google Drive 報告並發布

on:
  schedule:
    # 台灣時間每週一至週五 07:15 自動執行 (對應 UTC Sun-Thu 23:15)
    - cron: '15 23 * * 0-4'
  workflow_dispatch: # 支援在 GitHub 網頁上手動一鍵立即更新

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出儲存庫
        uses: actions/checkout@v4

      - name: 從 Google Drive 專屬資料夾下載最新 HTML 報告
        run: |
          # 抓取專屬資料夾內最新報告檔案 (已修正圖例與按鈕)
          FILE_ID="1gfdHzpE2Pd-UO-4B7AT0WGmBydDcPOuQ"
          curl -L "https://drive.google.com/uc?export=download&id=${FILE_ID}" -o index.html

      - name: 部署至 GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
