name: 每日自動生成並發布市場監控報告

on:
  schedule:
    # 台灣時間每週一至週五 07:00 (UTC Sun-Thu 23:00)
    - cron: '0 23 * * 0-4'
  workflow_dispatch: # ⭐️ 這行是讓 Actions 頁面出現手動執行按鈕的關鍵

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出儲存庫
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝相依套件
        run: pip install yfinance

      - name: 執行 Python 生成報告並發送 Email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python generate_report.py
          ls -la index.html

      - name: 設定 GitHub Pages 環境
        uses: actions/configure-pages@v5

      - name: 上傳網頁成品
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 官方直接部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
